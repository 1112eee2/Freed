name: Retrieve r3 TSan evidence
on:
  pull_request:
    branches: [codex/astra-g2-race-handoff]
    paths: ['.github/workflows/r3-publication-tsan.yml']
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read original diagnostic artifact without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/1112eee2/ThaiMakhosEngine/actions/artifacts/10443681624/zip > evidence.zip
          python3 - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          p=Path("evidence.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="4d12f42e2457bca75cf762255f66a3062582c741c4add4101cbf5e9017974357"
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if not n.endswith("/"):
                      print("R3_EVIDENCE_FILE "+json.dumps({"path":n,"content":z.read(n).decode("utf-8")}))
          PY
