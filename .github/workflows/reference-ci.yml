name: Reference and GUI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the developer-check dependency
        run: python -m pip install psutil
      - name: Portable reference and browser regression tests
        run: python -B tools/verification/run_tests.py --output-dir build/ci-reference
      - name: Show result
        if: always()
        shell: python
        run: |
          from pathlib import Path
          result = Path('build/ci-reference/result.json')
          print(result.read_text() if result.exists() else 'No complete report was produced.')
