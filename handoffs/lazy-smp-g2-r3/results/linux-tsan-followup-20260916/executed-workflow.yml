name: Isolated r3 publication TSan
on:
  pull_request:
    branches: [codex/astra-g2-race-handoff]
    paths:
      - 'handoffs/lazy-smp-g2-r3/results/linux-tsan-followup-20260916/**'
      - '.github/workflows/r3-publication-tsan.yml'
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Clang TSan and debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev gdb
      - name: Frozen snapshot and diagnostics
        working-directory: handoffs/lazy-smp-g2-r3
        run: python3 results/linux-tsan-followup-20260916/collect.py hosted
      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r3-tsan-evidence
          path: |
            handoffs/lazy-smp-g2-r3/results/linux-tsan-followup-20260916/hosted/**
            !handoffs/lazy-smp-g2-r3/results/linux-tsan-followup-20260916/hosted/binaries/**
          if-no-files-found: error

