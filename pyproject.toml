[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freed"
version = "1.0.2"
description = "Freed: a Thai Makhos (Thai checkers) engine by Thai people, for Thai people. Exact rules, alpha-beta search, NNUE evaluation and endgame tablebases"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pinggo" }]
keywords = ["freed", "thai-checkers", "makhos", "draughts", "game-engine", "nnue"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
tune = ["numpy"]

[project.scripts]
freed = "makhos.cli:main"
makhos = "makhos.cli:main"

[project.urls]
Repository = "https://github.com/1112eee2/Freed"

[tool.setuptools.packages.find]
include = ["makhos", "makhos.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
